<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프라이팬 긁힘 정도 진단 AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 40px; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #preview-img { max-width: 100%; max-height: 300px; border-radius: 10px; display: none; margin-top: 15px; }
        .progress { height: 25px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h2 class="text-center mb-4">🍳 프라이팬 긁힘 진단 AI</h2>
                    <p class="text-muted text-center">프라이팬 사진을 업로드하여 긁힘 상태를 실시간으로 진단해 보세요.</p>
                    
                    <!-- 모델 로딩 상태 -->
                    <div id="loading-status" class="alert alert-warning text-center" role="alert">
                        AI 모델을 불러오는 중입니다... 잠시만 기다려주세요.
                    </div>

                    <!-- 파일 업로드 폼 -->
                    <div class="mb-3" id="upload-section" style="display: none;">
                        <label for="imageUpload" class="form-label">프라이팬 사진 선택</label>
                        <input class="form-control" type="file" id="imageUpload" accept="image/*">
                    </div>

                    <!-- 이미지 미리보기 -->
                    <div class="text-center">
                        <img id="preview-img" alt="업로드된 프라이팬 사진">
                    </div>

                    <!-- 결과 출력 섹션 -->
                    <div id="result-section" class="mt-4" style="display: none;">
                        <h4 class="mb-3">진단 결과</h4>
                        <div id="label-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TensorFlow.js 및 Teachable Machine 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
