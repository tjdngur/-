<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프라이팬 긁힘 정도 학습 및 판독 AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { background-color: #4f46e5; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .status-badge { background-color: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background-color: #10b981; }
        .dot.empty { background-color: #f59e0b; }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label { font-size: 13px; font-weight: 500; color: #cbd5e1; display: block; margin-bottom: 6px; }
        select, input[type="file"] {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        select:focus, input:focus { border-color: #4f46e5; }
        
        .preview-box {
            width: 100%;
            height: 180px;
            background-color: #020617;
            border: 1px dashed #475569;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            margin-top: 8px;
        }
        .preview-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .preview-box span { color: #64748b; font-size: 13px; text-align: center; }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover { background-color: #4338ca; }
        button:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
        button.danger { background-color: #e11d48; }
        button.danger:hover { background-color: #be123c; }

        .dataset-list {
            flex: 1;
            max-height: 180px;
            overflow-y: auto;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #334155;
        }
        .tag { padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 11px; }
        .tag-0 { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-1 { background-color: rgba(234, 179, 8, 0.2); color: #facc15; }
        .tag-2 { background-color: rgba(249, 115, 22, 0.2); color: #fb923c; }
        .tag-3 { background-color: rgba(225, 29, 72, 0.2); color: #fb7185; }

        .result-panel {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .result-grade { font-size: 20px; font-weight: 700; margin-top: 6px; }
        .progress-container {
            width: 100%;
            background-color: #1e293b;
            border-radius: 20px;
            height: 20px;
            overflow: hidden;
            border: 1px solid #334155;
            margin-top: 12px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #f59e0b, #e11d48);
            transition: width 0.5s ease-in-out;
        }
        .info-box {
            background-color: rgba(79, 70, 229, 0.1);
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: #a5b4fc;
            line-height: 1.5;
        }
        footer { text-align: center; padding: 16px; font-size: 12px; color: #64748b; border-top: 1px solid #334155; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">🍳</div>
            <div>
                <h1>PanGuard AI</h1>
                <p style="font-size: 11px; color: #94a3b8;">프라이팬 긁힘 정도 머신러닝 학습 & 진단</p>
            </div>
        </div>
        <div class="status-badge">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">학습 데이터 없음 (0개)</span>
        </div>
    </header>

    <main>
        <!-- 좌측: AI 학습 관리 -->
        <section class="card">
            <div class="card-title">
                <span>📊 AI 학습 데이터 관리</span>
                <span id="totalBadge" style="font-size: 12px; color: #818cf8;">0장 학습됨</span>
            </div>

            <div>
                <label>프라이팬 상태 라벨 선택</label>
                <select id="trainLabel">
                    <option value="0">🟢 깨끗함 (긁힘 없음 - 0~20%)</option>
                    <option value="1">🟡 미세한 긁힘 (경미 - 21~50%)</option>
                    <option value="2">🟠 보통 긁힘 (주의 - 51~80%)</option>
                    <option value="3">🔴 심한 긁힘 (교체 권장 - 81~100%)</option>
                </select>
            </div>

            <div>
                <label>프라이팬 사진 업로드</label>
                <input type="file" id="trainImageInput" accept="image/*">
                <div class="preview-box" id="trainPreviewBox" style="display: none;">
                    <img id="trainPreviewImg" alt="미리보기">
                </div>
            </div>

            <button onclick="addTrainingData()">현재 사진 AI 학습시키기</button>

            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 12px; color: #94a3b8; font-weight: 600;">학습된 데이터 목록</span>
                    <button onclick="clearAllData()" class="danger" style="width: auto; padding: 4px 8px; font-size: 11px;">전체 초기화</button>
                </div>
                <div id="datasetList" class="dataset-list">
                    <span style="color: #64748b; font-size: 12px; text-align: center; margin: auto;">학습된 데이터가 없습니다.</span>
                </div>
            </div>
        </section>

        <!-- 우측: 프라이팬 긁힘 진단 테스트 -->
        <section class="card">
            <div class="card-title">
                <span>🔍 프라이팬 긁힘 진단 (AI 테스트)</span>
            </div>

            <div>
                <label>진단할 프라이팬 사진 업로드</label>
                <input type="file" id="testImageInput" accept="image/*">
                <div class="preview-box" id="testPreviewBox">
                    <span id="testPlaceholder">진단할 사진을 업로드하세요</span>
                    <img id="testPreviewImg" alt="진단 이미지" style="display: none;">
                </div>
            </div>

            <div class="result-panel">
                <span style="font-size: 12px; color: #94a3b8;">AI 분석 결과</span>
                <div class="result-grade" id="resultGrade">대기 중</div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div id="resultPercent" style="font-size: 16px; font-weight: bold; margin-top: 8px; color: #34d399;">0%</div>
            </div>

            <button onclick="runInference()" id="inferBtn" disabled>긁힘 정도 진단하기</button>

            <div class="info-box">
                💡 <strong>팁:</strong> 깨끗한 프라이팬 사진과 긁힌 프라이팬 사진을 각각 여러 장 등록해 학습시키면 AI의 판독 정확도가 높아집니다. 브라우저(Local Storage)에 안전하게 저장됩니다.
            </div>
        </section>
    </main>

    <footer>
        © 2026 PanGuard AI. GitHub Pages Ready.
    </footer>

    <script>
        // 로컬 스토리지 데이터 로드
        let dataset = JSON.parse(localStorage.getItem('pan_dataset')) || [];
        let currentTrainFile = null;
        let currentTestFile = null;

        window.onload = function() {
            updateUI();
        };

        // 1. 학습 이미지 선택 이벤트
        document.getElementById('trainImageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                currentTrainFile = file;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('trainPreviewImg').src = evt.target.result;
                    document.getElementById('trainPreviewBox').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        });

        // 2. 테스트 이미지 선택 이벤트
        document.getElementById('testImageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                currentTestFile = file;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById('testPreviewImg');
                    img.src = evt.target.result;
                    img.style.display = 'block';
                    document.getElementById('testPlaceholder').style.display = 'none';
                    
                    document.getElementById('inferBtn').disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });

        // 3. 이미지 특징(색상 평균 및 스크래치 텍스처/명암 분산) 추출 함수
        function extractFeatures(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 64;
                        canvas.height = 64;
                        ctx.drawImage(img, 0, 0, 64, 64);
                        
                        const imgData = ctx.getImageData(0, 0, 64, 64);
                        const data = imgData.data;
                        let rSum = 0, gSum = 0, bSum = 0;
                        let brightnessArr = [];
                        let pixels = data.length / 4;

                        for (let i = 0; i < data.length; i += 4) {
                            let r = data[i], g = data[i+1], b = data[i+2];
                            rSum += r; gSum += g; bSum += b;
                            brightnessArr.push(r * 0.299 + g * 0.587 + b * 0.114);
                        }

                        let avgBrightness = brightnessArr.reduce((a, b) => a + b, 0) / pixels;
                        let variance = brightnessArr.reduce((sum, b) => sum + Math.pow(b - avgBrightness, 2), 0) / pixels;
                        
                        resolve({
                            r: rSum / pixels,
                            g: gSum / pixels,
                            b: bSum / pixels,
                            texture: Math.sqrt(variance) // 긁힘에 따른 거칠기/명암 편차
                        });
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 4. 학습 데이터 추가
        async function addTrainingData() {
            if (!currentTrainFile) {
                alert('학습시킬 사진을 선택해주세요!');
                return;
            }

            const labelVal = parseInt(document.getElementById('trainLabel').value);
            const btn = event.target;
            btn.innerText = '특징 추출 및 학습 중...';
            btn.disabled = true;

            try {
                const features = await extractFeatures(currentTrainFile);
                dataset.push({
                    id: Date.now(),
                    label: labelVal,
                    features: features,
                    name: currentTrainFile.name
                });

                localStorage.setItem('pan_dataset', JSON.stringify(dataset));
                
                // 초기화
                currentTrainFile = null;
                document.getElementById('trainImageInput').value = '';
                document.getElementById('trainPreviewBox').style.display = 'none';
                
                updateUI();
                alert('AI 학습이 완료되었습니다!');
            } catch (err) {
                console.error(err);
                alert('학습 중 오류가 발생했습니다.');
            } finally {
                btn.innerText = '현재 사진 AI 학습시키기';
                btn.disabled = false;
            }
        }

        // 5. UI 업데이트
        function updateUI() {
            const badge = document.getElementById('totalBadge');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            const listContainer = document.getElementById('datasetList');

            badge.innerText = `${dataset.length}장 학습됨`;

            if (dataset.length > 0) {
                statusText.innerText = `AI 모델 학습 완료 (${dataset.length}개)`;
                statusDot.className = 'dot';
            } else {
                statusText.innerText = '학습 데이터 없음 (0개)';
                statusDot.className = 'dot empty';
            }

            if (dataset.length === 0) {
                listContainer.innerHTML = `<span style="color: #64748b; font-size: 12px; text-align: center; margin: auto;">학습된 데이터가 없습니다.</span>`;
                return;
            }

            const labelNames = ['깨끗함', '미세 긁힘', '보통 긁힘', '심한 긁힘'];
            let html = '';
            dataset.slice().reverse().forEach(item => {
                html += `
                    <div class="data-item">
                        <div style="display: flex; align-items: center; gap: 8px; overflow: hidden;">
                            <span class="tag tag-${item.label}">${labelNames[item.label]}</span>
                            <span style="color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;">${item.name}</span>
                        </div>
                        <button onclick="deleteItem(${item.id})" style="background:none; border:none; color:#f43f5e; cursor:pointer; font-size:12px; width:auto; padding:2px;">삭제</button>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function deleteItem(id) {
            dataset = dataset.filter(item => item.id !== id);
            localStorage.setItem('pan_dataset', JSON.stringify(dataset));
            updateUI();
        }

        function clearAllData() {
            if (confirm('모든 학습 데이터를 초기화하시겠습니까?')) {
                dataset = [];
                localStorage.removeItem('pan_dataset');
                updateUI();
            }
        }

        // 6. K-NN 머신러닝 판독 수행
        async function runInference() {
            if (!currentTestFile) return;
            if (dataset.length === 0) {
                alert('판독을 수행하려면 최소 1장 이상의 학습 데이터가 필요합니다.');
                return;
            }

            const btn = document.getElementById('inferBtn');
            btn.innerText = '분석 중...';
            btn.disabled = true;

            try {
                const testFeatures = await extractFeatures(currentTestFile);

                let scored = dataset.map(item => {
                    let f = item.features;
                    let dist = Math.sqrt(
                        Math.pow(f.r - testFeatures.r, 2) +
                        Math.pow(f.g - testFeatures.g, 2) +
                        Math.pow(f.b - testFeatures.b, 2) +
                        Math.pow((f.texture - testFeatures.texture) * 2, 2)
                    );
                    return { dist, basePercent: (item.label / 3) * 100 };
                });

                scored.sort((a, b) => a.dist - b.dist);
                let k = Math.min(3, scored.length);
                let topK = scored.slice(0, k);

                let totalWeight = 0, weightedSum = 0;
                topK.forEach(item => {
                    let weight = 1 / (item.dist + 0.00001);
                    weightedSum += item.basePercent * weight;
                    totalWeight += weight;
                });

                let finalPercent = Math.round(weightedSum / totalWeight);
                finalPercent = Math.max(0, Math.min(100, finalPercent));

                let gradeText = '';
                if (finalPercent <= 20) gradeText = '🟢 최상급 상태 (긁힘 거의 없음)';
                else if (finalPercent <= 50) gradeText = '🟡 양호 상태 (미세한 사용감)';
                else if (finalPercent <= 80) gradeText = '🟠 주의 상태 (긁힘 발생)';
                else gradeText = '🔴 교체 권장 (심각한 코팅 손상)';

                document.getElementById('resultGrade').innerText = gradeText;
                document.getElementById('resultPercent').innerText = `${finalPercent}%`;
                document.getElementById('progressBar').style.width = `${finalPercent}%`;

            } catch (err) {
                console.error(err);
                alert('판독 중 오류가 발생했습니다.');
            } finally {
                btn.innerText = '긁힘 정도 진단하기';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
