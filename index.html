<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanGuard AI - 프라이팬 긁힘 정도 판독기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; }
        .logo-icon { background: #6366f1; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .badge { background: #1f2937; padding: 6px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; border: 1px solid #374151; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
        .status-dot.empty { background: #f59e0b; }

        .container {
            flex: 1;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media(max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .panel {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label { font-size: 12px; font-weight: 500; color: #9ca3af; display: block; margin-bottom: 6px; }
        select {
            width: 100%;
            background: #030712;
            border: 1px solid #374151;
            color: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        select:focus { border-color: #6366f1; }

        /* 드래그 앤 드롭 박스 */
        .dropzone {
            width: 100%;
            min-height: 150px;
            background: #030712;
            border: 2px dashed #374151;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 16px;
            text-align: center;
            transition: 0.2s;
            position: relative;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }
        .dropzone-text { font-size: 12px; color: #9ca3af; pointer-events: none; }
        .dropzone-text b { color: #818cf8; }
        input[type="file"] { display: none; }

        /* 썸네일 그리드 */
        .thumb-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            max-height: 110px;
            overflow-y: auto;
            margin-top: 8px;
        }
        .thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #374151;
        }

        /* 버튼 스타일 */
        .btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn:hover { background: #4f46e5; }
        .btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
        .btn-danger { background: #e11d48; }
        .btn-danger:hover { background: #be123c; }

        /* 학습된 데이터 목록 */
        .dataset-box {
            flex: 1;
            max-height: 160px;
            overflow-y: auto;
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid #1f2937;
        }
        .tag { padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tag-0 { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-1 { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .tag-2 { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
        .tag-3 { background: rgba(225, 29, 72, 0.2); color: #fb7185; }

        /* 결과 리스트 컨테이너 */
        .result-box {
            flex: 1;
            max-height: 220px;
            overflow-y: auto;
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .result-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .progress-bg {
            width: 100%;
            background: #030712;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            border: 1px solid #374151;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #f59e0b, #e11d48);
            transition: width 0.4s ease;
        }
        footer { text-align: center; padding: 16px; font-size: 11px; color: #6b7280; border-top: 1px solid #1f2937; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">🍳</div>
            <span>PanGuard AI</span>
        </div>
        <div class="badge">
            <div class="status-dot" id="headerDot"></div>
            <span id="headerText">학습 데이터 없음</span>
        </div>
    </header>

    <main class="container">
        <!-- 좌측: 학습 관리 -->
        <section class="panel">
            <div class="panel-title">
                <span>📊 1. 머신러닝 학습 데이터 추가</span>
                <span id="dataCountBadge" style="color: #818cf8; font-size: 12px;">0장</span>
            </div>

            <div>
                <label>일괄 부여할 프라이팬 긁힘 상태 라벨</label>
                <select id="trainLabelSelect">
                    <option value="0">🟢 깨끗함 (긁힘 없음 - 0~20%)</option>
                    <option value="1">🟡 미세한 긁힘 (경미 - 21~50%)</option>
                    <option value="2">🟠 보통 긁힘 (주의 - 51~80%)</option>
                    <option value="3">🔴 심한 긁힘 (교체 권장 - 81~100%)</option>
                </select>
            </div>

            <div>
                <label>프라이팬 사진 <b>여러 장</b> 드래그 또는 클릭 업로드</label>
                <div class="dropzone" id="trainDropzone">
                    <span class="dropzone-text" id="trainDropText">📁 사진들을 <b>여기로 끌어다 놓으세요</b><br>(클릭해서 파일 선택 가능)</span>
                    <div class="thumb-grid" id="trainThumbGrid"></div>
                </div>
                <input type="file" id="trainFileInput" accept="image/*" multiple>
            </div>

            <button class="btn" id="trainBtn" onclick="onTrain()" disabled>선택한 사진들 일괄 학습시키기 (0장)</button>

            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 11px; color: #9ca3af; font-weight: 600;">저장된 학습 데이터 세트</span>
                    <button class="btn btn-danger" style="width: auto; padding: 3px 8px; font-size: 10px;" onclick="onClearDataset()">전체 초기화</button>
                </div>
                <div class="dataset-box" id="datasetListContainer">
                    <span style="color: #4b5563; font-size: 11px; text-align: center; margin: auto;">학습 데이터가 없습니다.</span>
                </div>
            </div>
        </section>

        <!-- 우측: 판독 진단 -->
        <section class="panel">
            <div class="panel-title">
                <span>🔍 2. 프라이팬 긁힘 정도 진단 (AI 테스트)</span>
            </div>

            <div>
                <label>진단할 프라이팬 사진 <b>여러 장</b> 드래그 또는 클릭 업로드</label>
                <div class="dropzone" id="testDropzone">
                    <span class="dropzone-text" id="testDropText">📁 진단할 사진들을 <b>여기로 끌어다 놓으세요</b><br>(클릭해서 파일 선택 가능)</span>
                    <div class="thumb-grid" id="testThumbGrid"></div>
                </div>
                <input type="file" id="testFileInput" accept="image/*" multiple>
            </div>

            <button class="btn" id="inferBtn" onclick="onInference()" disabled style="background: #059669;">업로드한 사진들 일괄 진단하기 (0장)</button>

            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
                <span style="font-size: 11px; color: #9ca3af; font-weight: 600;">AI 진단 결과 (백분율 및 상태)</span>
                <div class="result-box" id="resultContainer">
                    <span style="color: #4b5563; font-size: 11px; text-align: center; margin: auto;">진단할 사진을 올리고 버튼을 누르세요.</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        © 2026 PanGuard AI. GitHub Pages Ready.
    </footer>

    <script>
        // 브라우저 기본 드래그 앤 드롭 파일 열림 방지
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => e.preventDefault());

        // 로컬 스토리지 데이터 동기화
        let dataset = JSON.parse(localStorage.getItem('panguard_dataset')) || [];
        let trainFiles = [];
        let testFiles = [];

        window.onload = () => {
            updateDatasetUI();
            setupDropzone('trainDropzone', 'trainFileInput', files => {
                trainFiles = files;
                renderThumbnails('trainThumbGrid', 'trainDropText', trainFiles, 'trainBtn', '선택한 사진들 일괄 학습시키기');
            });
            setupDropzone('testDropzone', 'testFileInput', files => {
                testFiles = files;
                renderThumbnails('testThumbGrid', 'testDropText', testFiles, 'inferBtn', '업로드한 사진들 일괄 진단하기');
            });
        };

        function setupDropzone(zoneId, inputId, onFilesReady) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);

            zone.addEventListener('click', () => input.click());
            zone.addEventListener('dragover', () => zone.classList.add('dragover'));
            zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
            zone.addEventListener('drop', e => {
                e.preventDefault();
                zone.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const valid = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
                    onFilesReady(valid);
                }
            });
            input.addEventListener('change', e => {
                if (e.target.files && e.target.files.length > 0) {
                    const valid = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
                    onFilesReady(valid);
                }
            });
        }

        function renderThumbnails(gridId, textId, files, btnId, btnTextPrefix) {
            const grid = document.getElementById(gridId);
            const text = document.getElementById(textId);
            const btn = document.getElementById(btnId);

            grid.innerHTML = '';
            if (files.length > 0) {
                text.style.display = 'none';
                btn.disabled = false;
                btn.innerText = `${btnTextPrefix} (${files.length}장)`;

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const img = document.createElement('img');
                        img.className = 'thumb';
                        img.src = e.target.result;
                        grid.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                });
            } else {
                text.style.display = 'block';
                btn.disabled = true;
                btn.innerText = `${btnTextPrefix} (0장)`;
            }
        }

        // 이미지 특징 추출 (색상 RGB 및 스크래치 텍스처/명암 분산 계산)
        function extractFeatures(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 64;
                        canvas.height = 64;
                        ctx.drawImage(img, 0, 0, 64, 64);

                        const imgData = ctx.getImageData(0, 0, 64, 64);
                        const data = imgData.data;
                        let rSum = 0, gSum = 0, bSum = 0;
                        let brightnessArr = [];
                        let pixels = data.length / 4;

                        for (let i = 0; i < data.length; i += 4) {
                            let r = data[i], g = data[i+1], b = data[i+2];
                            rSum += r; gSum += g; bSum += b;
                            brightnessArr.push(r * 0.299 + g * 0.587 + b * 0.114);
                        }

                        let avgB = brightnessArr.reduce((a, b) => a + b, 0) / pixels;
                        let variance = brightnessArr.reduce((sum, b) => sum + Math.pow(b - avgB, 2), 0) / pixels;

                        resolve({
                            r: rSum / pixels,
                            g: gSum / pixels,
                            b: bSum / pixels,
                            texture: Math.sqrt(variance) // 긁힘/반사광 거칠기 편차
                        });
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 학습 실행
        async function onTrain() {
            if (trainFiles.length === 0) return;
            const labelVal = parseInt(document.getElementById('trainLabelSelect').value);
            const btn = document.getElementById('trainBtn');
            btn.innerText = '머신러닝 특징 추출 및 학습 중...';
            btn.disabled = true;

            try {
                for (let file of trainFiles) {
                    const features = await extractFeatures(file);
                    dataset.push({
                        id: Date.now() + Math.random(),
                        label: labelVal,
                        features: features,
                        name: file.name
                    });
                }

                localStorage.setItem('panguard_dataset', JSON.stringify(dataset));
                
                // 초기화
                trainFiles = [];
                document.getElementById('trainFileInput').value = '';
                document.getElementById('trainThumbGrid').innerHTML = '';
                document.getElementById('trainDropText').style.display = 'block';

                updateDatasetUI();
                alert('모든 사진이 AI 학습 데이터에 추가되었습니다!');
            } catch (err) {
                console.error(err);
                alert('학습 중 오류가 발생했습니다.');
            } finally {
                btn.innerText = '선택한 사진들 일괄 학습시키기 (0장)';
            }
        }

        function updateDatasetUI() {
            const badge = document.getElementById('dataCountBadge');
            const headerText = document.getElementById('headerText');
            const headerDot = document.getElementById('headerDot');
            const container = document.getElementById('datasetListContainer');

            badge.innerText = `${dataset.length}장`;

            if (dataset.length > 0) {
                headerText.innerText = `학습 완료 (${dataset.length}개)`;
                headerDot.className = 'status-dot';
            } else {
                headerText.innerText = '학습 데이터 없음';
                headerDot.className = 'status-dot empty';
            }

            if (dataset.length === 0) {
                container.innerHTML = `<span style="color: #4b5563; font-size: 11px; text-align: center; margin: auto;">학습 데이터가 없습니다.</span>`;
                return;
            }

            const labelNames = ['깨끗함', '미세 긁힘', '보통 긁힘', '심한 긁힘'];
            let html = '';
            dataset.slice().reverse().forEach(item => {
                html += `
                    <div class="data-row">
                        <div style="display: flex; align-items: center; gap: 6px; overflow: hidden;">
                            <span class="tag tag-${item.label}">${labelNames[item.label]}</span>
                            <span style="color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px;">${item.name}</span>
                        </div>
                        <button onclick="onDeleteData(${item.id})" style="background:none; border:none; color:#f43f5e; cursor:pointer; font-size:11px;">삭제</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function onDeleteData(id) {
            dataset = dataset.filter(d => d.id !== id);
            localStorage.setItem('panguard_dataset', JSON.stringify(dataset));
            updateDatasetUI();
        }

        function onClearDataset() {
            if (confirm('모든 학습 데이터를 초기화하시겠습니까?')) {
                dataset = [];
                localStorage.removeItem('panguard_dataset');
                updateDatasetUI();
            }
        }

        // 진단(인퍼런스) 실행
        async function onInference() {
            if (testFiles.length === 0) return;
            if (dataset.length === 0) {
                alert('판독하려면 최소 1장 이상의 학습 데이터가 필요합니다.');
                return;
            }

            const btn = document.getElementById('inferBtn');
            btn.innerText = 'AI 진단 분석 중...';
            btn.disabled = true;

            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '';

            try {
                for (let file of testFiles) {
                    const testFeatures = await extractFeatures(file);

                    // K-NN 거리 계산 (유클리디안 거리 기반 유사도 측정)
                    let scored = dataset.map(item => {
                        let f = item.features;
                        let dist = Math.sqrt(
                            Math.pow(f.r - testFeatures.r, 2) +
                            Math.pow(f.g - testFeatures.g, 2) +
                            Math.pow(f.b - testFeatures.b, 2) +
                            Math.pow((f.texture - testFeatures.texture) * 2, 2)
                        );
                        return { dist, basePercent: (item.label / 3) * 100 };
                    });

                    scored.sort((a, b) => a.dist - b.dist);
                    let k = Math.min(3, scored.length);
                    let topK = scored.slice(0, k);

                    let totalWeight = 0, weightedSum = 0;
                    topK.forEach(item => {
                        let weight = 1 / (item.dist + 0.00001);
                        weightedSum += item.basePercent * weight;
                        totalWeight += weight;
                    });

                    let finalPercent = Math.round(weightedSum / totalWeight);
                    finalPercent = Math.max(0, Math.min(100, finalPercent));

                    let gradeText = '';
                    if (finalPercent <= 20) gradeText = '🟢 최상급 상태 (긁힘 거의 없음)';
                    else if (finalPercent <= 50) gradeText = '🟡 양호 상태 (미세한 사용감)';
                    else if (finalPercent <= 80) gradeText = '🟠 주의 상태 (긁힘 발생)';
                    else gradeText = '🔴 교체 권장 (심각한 코팅 손상)';

                    const card = document.createElement('div');
                    card.className = 'result-card';
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #9ca3af;">
                            <span style="font-weight: bold; color: #f3f4f6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px;">${file.name}</span>
                            <span style="color: #34d399; font-weight: bold; font-size: 12px;">${finalPercent}%</span>
                        </div>
                        <div style="font-size: 11px; font-weight: bold;">${gradeText}</div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${finalPercent}%;"></div>
                        </div>
                    `;
                    resultContainer.appendChild(card);
                }
            } catch (err) {
                console.error(err);
                alert('진단 중 오류가 발생했습니다.');
            } finally {
                btn.innerText = `업로드한 사진들 일괄 진단하기 (${testFiles.length}장)`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
